name: Build
on:
  push:
    branches:
      - n64
      - main
      - ci
  pull_request:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi ninja-build

    - name: Checkout pico-sdk
      uses: actions/checkout@v4
      with:
        repository: raspberrypi/pico-sdk
        path: pico-sdk
        submodules: true

    - name: Build apps/n64_hdmi (240p / 480p / 720p)
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      run: |
        for mode in 240P 480P 720P; do
          cmake -S software/apps/n64_hdmi -B build-n64-hdmi-$mode -G Ninja \
            -DPICO_SDK_PATH=$PICO_SDK_PATH -DN64_HDMI_MODE=$mode
          cmake --build build-n64-hdmi-$mode
          mkdir -p artifacts
          cp build-n64-hdmi-$mode/n64_hdmi.uf2 artifacts/n64_hdmi-$mode.uf2
        done

    - name: Build apps/n64_hdmi_osd_overlay (240p-default / 480p-default / 720p-default)
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      run: |
        for mode in 240P 480P 720P; do
          cmake -S software/apps/n64_hdmi_osd_overlay -B build-n64-hdmi-osd-$mode -G Ninja \
            -DPICO_SDK_PATH=$PICO_SDK_PATH -DN64_HDMI_MODE=$mode
          cmake --build build-n64-hdmi-osd-$mode
          cp build-n64-hdmi-osd-$mode/n64_hdmi_osd_overlay.uf2 artifacts/n64_hdmi_osd_overlay-$mode.uf2
        done

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: n64-picohdmi
        path: artifacts/*
